# GitHub Actions: タグ push をトリガに 3 OS 分の配布パッケージをビルドし、
# GitHub Releases に公開する。
#
#   トリガ:
#     - `v*` 形式のタグ push (v1.0.0 / v1.0.0-beta.1 など)
#     - workflow_dispatch (GitHub UI から手動起動: 試運転用)
#
#   フロー:
#     1. matrix で macOS / Linux / Windows それぞれビルド + 配布パッケージ化
#        (.dmg / AppImage / .zip)
#     2. 3 OS の成果物を release ジョブに集約
#     3. ファイル名にタグを埋め込み (例: farman-v1.0.0-macos-arm64.dmg)
#     4. GitHub Releases に **draft** として作成し、3 OS の成果物を添付
#        → 中身を確認してから手動で Publish するワークフロー
#
#   macOS は **Apple Silicon (arm64) 専用**。Intel Mac 対応は v0.9.0-test
#   で試したが macos-13 runner が GitHub Actions で実質利用不可になっており
#   断念 (SPEC.md バックログ参照)。Intel Mac で動かしたいユーザーはローカル
#   ビルドで対応する運用。
#
#   署名: MACOS_* Secrets が全部揃っていれば Developer ID 署名 + Notarization、
#   揃っていなければ ad-hoc 署名のみ (Gatekeeper にブロックされる)。詳細は
#   ローカルの CODE_SIGNING.md 参照。
#
#   build.yml と大半重複するが、reusable workflow に切り出すよりは並べた
#   方が読みやすいので素朴に二重に書く。Qt / 依存ライブラリのバージョンが
#   変わったら両方を更新する必要がある点に注意。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0). 手動起動時のみ必須。'
        required: true

env:
  QT_VERSION: 6.10.3
  BUILD_TYPE: Release

jobs:
  # ──────── リリース前チェック ────────
  # What's New (resources/whatsnew/*.md) がこのリリースのバージョン向けに
  # 更新済みかを検証する。見出しのバージョン不一致 = 更新し忘れとみなし、
  # 3 OS のビルドを始める前に fail させる。ローカルでも
  # `tools/check_whatsnew.sh` で同じチェックを実行できる。
  check:
    name: Pre-release checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check What's New is updated for this release
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          tools/check_whatsnew.sh "${tag}"

  build:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      # 1 OS が落ちても他 OS の成果物は確保したい (片肺リリース判定は
      # 後段の release ジョブで人間が draft を見て判断する想定)。
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-latest
            qt_host: mac
            qt_arch: clang_64
            artifact_name: macos
            artifact_path: build/farman.dmg

          - name: Linux (x86_64)
            # build.yml と同様 22.04 を明示 (AppImage の glibc 互換のため)
            os: ubuntu-22.04
            qt_host: linux
            qt_arch: linux_gcc_64
            artifact_name: linux
            # linux-dist/ に AppImage と .deb の両方を入れて受け渡す
            artifact_path: linux-dist

          - name: Windows (x86_64)
            os: windows-latest
            qt_host: windows
            qt_arch: win64_msvc2022_64
            artifact_name: windows
            # windows-dist/ に Inno Setup 製 .exe インストーラと
            # 生 zip (ポータブル用途) の両方を入れて受け渡す
            artifact_path: windows-dist

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          # qt5compat: Core5Compat (QTextCodec 経由のエンコード判定で使う)
          # qtimageformats: WebP / TIFF / JP2 / MNG / TGA / WBMP プラグイン。
          #   essential add-ons には含まれず明示が必要。これを入れないと
          #   imageformats プラグインは GIF / ICO / JPEG / SVG だけになり、
          #   開発機 (Homebrew Qt の全部入り) との挙動差が出る。
          # qtpdf: Qt PDF / Qt PdfWidgets (PDF ビュアー)。PDFium ベースで
          #   essential 外なので明示。
          # qtmultimedia: Qt Multimedia / MultimediaWidgets (動画・音声
          #   ビュアープラグイン MediaViewerPlugin)。essential 外なので明示。
          modules: 'qt5compat qtimageformats qtpdf qtmultimedia'
          cache: true

      # ──────── 依存ライブラリ ────────
      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libarchive uchardet pkg-config create-dmg

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libarchive-dev \
            libuchardet-dev \
            libheif-dev \
            pkg-config \
            libgl1-mesa-dev \
            libxkbcommon-dev

      # vcpkg binary cache (GitHub Actions Cache バックエンド) で
      # 2 回目以降の Windows ビルド時間を 12〜15 分 → 3〜5 分に短縮する。
      - name: Setup vcpkg binary cache env (Windows)
        if: runner.os == 'Windows'
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          # libheif は libde265 (HEVC デコーダ) をコア依存として常に含む。
          # farman は HEIC を「読む」だけなのでエンコーダ (x265) は不要なので
          # [core] でデフォルトフィーチャー (x265) を無効化する。
          #
          # libheif は動的リンク (LGPL 準拠) のまま、プラグインローディングを
          # 無効化したカスタムトリプレット x64-windows-heif でビルドする。動的
          # heif.dll の既定ビルドはプラグイン機構の起動時初期化に失敗して
          # GetLastError=1114 (ERROR_DLL_INIT_FAILED) → farman.exe が 0xc0000142
          # で起動できなかったため (詳細は ci/vcpkg-triplets/x64-windows-heif.cmake)。
          vcpkg install libarchive:x64-windows uchardet:x64-windows `
            "libheif[core]:x64-windows-heif" `
            --overlay-triplets="$((Get-Location).Path)/ci/vcpkg-triplets"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" `
            | Out-File -FilePath $env:GITHUB_ENV -Append

      # ──────── Configure / Build ────────
      # タグ名から prerelease サフィックスを抽出してバイナリ FARMAN_VERSION に
      # 埋め込む。`v0.9.1-test` → suffix=test → FARMAN_VERSION=0.9.1-test。
      # semver 規約 (x.y.z-suffix < x.y.z) によって、test ビルドから安定版への
      # 自動アップデート検知が正しく動くようになる。`v0.9.1` のようなサフィックス
      # なしタグの場合は空文字で CMake 側がそのまま PROJECT_VERSION を使う。
      - name: Determine FARMAN_VERSION_SUFFIX from tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          tag_no_v="${tag#v}"
          if [[ "${tag_no_v}" == *-* ]]; then
            suffix="${tag_no_v#*-}"
          else
            suffix=""
          fi
          echo "FARMAN_VERSION_SUFFIX=${suffix}" >> "$GITHUB_ENV"
          echo "Resolved suffix='${suffix}' from tag='${tag}'"

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DFARMAN_VERSION_SUFFIX="${FARMAN_VERSION_SUFFIX}"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # libheif は x64-windows-heif トリプレットで入れているので、その
          # installed ディレクトリを CMAKE_PREFIX_PATH に足して find_package が
          # 見つけられるようにする (libarchive / uchardet は toolchain が
          # x64-windows から解決する)。
          cmake -B build `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="$env:VCPKG_ROOT/installed/x64-windows-heif" `
            -DFARMAN_VERSION_SUFFIX="$env:FARMAN_VERSION_SUFFIX"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 2

      # macOS arm64 ランナーは 3 vCPU / 7 GB と小さく、`--parallel` 無制限だと
      # 重い翻訳単位 (-O2 の Qt 依存ファイル) が同時多発してメモリ逼迫 → clang が
      # ストールしてジョブが固まる事象が頻発した (v0.9.4 / v0.9.5)。Linux と同じく
      # 2 並列に制限して安定させる (多少遅くなってもリリースの信頼性を優先)。
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 2

      # Windows ランナーはメモリに余裕があり無制限並列でも安定しているので据え置き。
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      # ──────── Deploy: 配布形式へ整形 ────────
      # macOS は「Secrets が全部揃っていれば Developer ID 署名 + Notarization、
      # 揃っていなければ ad-hoc 署名で従来通り」の 2 モード運用にする。
      # 必要 Secrets (5 つ):
      #   MACOS_CERTIFICATE_BASE64       .p12 (Developer ID Application) の base64
      #   MACOS_CERTIFICATE_PASSWORD     .p12 のパスワード
      #   MACOS_NOTARIZATION_APPLE_ID    Apple ID メール
      #   MACOS_NOTARIZATION_TEAM_ID     10 桁の Team ID
      #   MACOS_NOTARIZATION_PASSWORD    App-specific password
      # GitHub Actions では Secrets を if 条件で直接参照できないため、
      # 「sign-check」ステップで env 経由に展開し、その output を後続の if で見る。

      - name: Determine signing availability (macOS)
        if: runner.os == 'macOS'
        id: sign-check
        shell: bash
        env:
          CERT_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$CERT_BASE64" ]; then
            echo "available=true"  >> "$GITHUB_OUTPUT"
            echo "Developer ID signing available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing NOT available; falling back to ad-hoc signing (Gatekeeper will block, users need right-click → Open)."
          fi

      - name: Import Developer ID certificate (macOS, signed runs only)
        if: runner.os == 'macOS' && steps.sign-check.outputs.available == 'true'
        shell: bash
        env:
          CERT_BASE64:   ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          # 一時 Keychain に .p12 を import。ジョブ終了時にランナーごと破棄される。
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain  -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S "apple-tool:,apple:,codesign:" \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          IDENTITY_HASH=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -n 1 | awk '{print $2}')
          if [ -z "$IDENTITY_HASH" ]; then
            echo "::error::Developer ID Application identity not found after import"
            exit 1
          fi
          echo "MACOS_IDENTITY_HASH=$IDENTITY_HASH" >> "$GITHUB_ENV"

      - name: Deploy (macOS)
        if: runner.os == 'macOS'
        env:
          SIGN_AVAILABLE: ${{ steps.sign-check.outputs.available }}
        run: |
          # macdeployqt で Qt frameworks を .app に埋める
          # (-libpath: Homebrew の libwebp / libsharpyuv を解決させる)
          plugin_exec_args=()
          for plugin in build/farman.app/Contents/PlugIns/viewers/*.dylib; do
            plugin_exec_args+=( "-executable=$plugin" )
          done
          macdeployqt build/farman.app -libpath=/opt/homebrew/lib "${plugin_exec_args[@]}"

          # 外部 (第三者製) プラグインを Hardened Runtime の .app にロードできる
          # ようにするエンタイトルメント (library validation を無効化)。実際に
          # 外部プラグインを読むかは farman 側の設定でゲートする。
          ENTITLEMENTS="macos/farman.entitlements"
          if [ "$SIGN_AVAILABLE" = "true" ]; then
            # 正式署名: Hardened Runtime (notarization 必須) + timestamp
            codesign --force --deep --options runtime --timestamp \
              --entitlements "$ENTITLEMENTS" \
              --sign "$MACOS_IDENTITY_HASH" build/farman.app
          else
            # フォールバック: ad-hoc 署名のみ。配布先で Gatekeeper にブロックされる
            # ので「右クリック → 開く」での起動を案内する想定。ad-hoc + Hardened
            # Runtime 無しでは library validation は効かないので entitlements 不要。
            codesign --force --deep --sign - build/farman.app
          fi
          codesign --verify --deep --strict build/farman.app

          # DMG レイアウト: 左に farman.app、右に /Applications シンボリックリンク
          # を並べた典型的な Mac インストーラ配置。create-dmg は内部で hdiutil
          # と AppleScript (Finder ウィンドウ操作) を組み合わせて .DS_Store に
          # アイコン位置を書き込む。
          #
          # create-dmg の <source_folder> 引数はそのディレクトリの「中身」を
          # DMG 直下に展開するので、farman.app を含むステージングディレクトリ
          # を別途用意してから渡す。build/farman.app を直接渡すと Contents/
          # 配下が DMG 直下に展開されてしまう。
          rm -rf build/dmg-staging
          mkdir -p build/dmg-staging
          cp -R build/farman.app build/dmg-staging/

          # OSS ライセンス通知を DMG ウィンドウ内に同梱 (BSD/LGPL/MPL の
          # バイナリ配布通知義務を満たす)。アプリ内 About → License Info でも
          # 参照できるが、配布物にも人間可読のファイルとして添える。
          cp LICENSE                                 build/dmg-staging/LICENSE.txt
          cp resources/licenses/THIRD-PARTY-LICENSES.txt build/dmg-staging/THIRD-PARTY-LICENSES.txt

          rm -f build/farman.dmg
          create-dmg \
            --volname "farman" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 175 190 \
            --icon "farman.app" 425 190 \
            --hide-extension "farman.app" \
            --no-internet-enable \
            build/farman.dmg \
            build/dmg-staging

          # DMG コンテナ自体も Developer ID 署名しておく (公証の前)。.app だけ
          # 署名 + 公証してもコンテナが未署名だと `spctl -t open` が「no usable
          # signature」になる。署名 → notarize → staple の順にすることで、配布
          # された .dmg がダウンロード直後のマウント時点から Notarized Developer
          # ID として完全に受理される。
          if [ "$SIGN_AVAILABLE" = "true" ]; then
            codesign --force --timestamp \
              --sign "$MACOS_IDENTITY_HASH" build/farman.dmg
          fi

      - name: Notarize and staple (macOS, signed runs only)
        if: runner.os == 'macOS' && steps.sign-check.outputs.available == 'true'
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          TEAM_ID:  ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
          PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
        run: |
          xcrun notarytool submit build/farman.dmg \
            --apple-id "$APPLE_ID" \
            --team-id  "$TEAM_ID" \
            --password "$PASSWORD" \
            --wait
          xcrun stapler staple build/farman.dmg

      - name: Deploy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 1. windeployqt + vcpkg DLL コピーで Release ディレクトリを self-contained 化
          windeployqt --release --no-translations build/Release/farman.exe

          # farman.exe は Qt6::OpenGL をリンクしているが、そのシンボルを直接使わない
          # ため MSVC リンカが未使用 import を落とし、windeployqt が Qt6OpenGL.dll を
          # 取り込まない (macOS/Linux はリンクだけで配布物に含まれる)。外部 3D
          # ビュアープラグイン (farman-plugin-3d) がロード時に Qt6OpenGL.dll を必要と
          # するため、Qt の bin から明示的にコピーする。
          $qtBin = Split-Path (Get-Command windeployqt).Source
          Copy-Item "$qtBin/Qt6OpenGL.dll" -Destination build/Release/ -Force

          # 同梱公式ビュアープラグインの Qt 依存も deploy する。farman.exe 自体が
          # リンクしない Qt モジュール (例: MediaViewerPlugin の Qt6Multimedia +
          # ffmpeg バックエンド) は exe への windeployqt では取り込まれないため、
          # 各プラグイン DLL を --dir で exe と同じディレクトリへ deploy する
          # (プラグインは farman.exe のプロセスにロードされるので、依存 DLL は
          # exe ディレクトリから解決される)。
          Get-ChildItem build/Release/plugins/viewers/*.dll | ForEach-Object {
            windeployqt --release --no-translations --dir build/Release $_.FullName
          }

          Copy-Item "$env:VCPKG_ROOT/installed/x64-windows/bin/*.dll" `
            -Destination build/Release/

          # libheif は別トリプレット (x64-windows-heif) なので bin が別ディレクトリ。
          # heif.dll / libde265.dll をそこからコピーする。
          Copy-Item "$env:VCPKG_ROOT/installed/x64-windows-heif/bin/*.dll" `
            -Destination build/Release/

          # 1b. Visual C++ Runtime (MSVCP140 / VCRUNTIME140 / VCRUNTIME140_1) を
          # 直接バンドル。windeployqt は VC Runtime DLL をコピーしないので、
          # VC Redist がプリインストールされていない PC (Windows Sandbox、
          # クリーンインストール直後の OS、サードパーティの最小環境など) で
          # "MSVCP140.dll が見つからない" エラーが出てしまう。
          # GitHub Actions の windows-latest runner では VS Dev Command Prompt が
          # 明示的にロードされていないと VCToolsRedistDir / VCINSTALLDIR が空に
          # なるので、複数の典型的なパスを fallback で検索する。
          $candidates = @()
          if ($env:VCToolsRedistDir) { $candidates += $env:VCToolsRedistDir }
          if ($env:VCINSTALLDIR)     { $candidates += "$env:VCINSTALLDIR\Redist\MSVC" }
          $candidates += @(
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC"
            "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Redist\MSVC"
            "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Redist\MSVC"
            "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\VC\Redist\MSVC"
            "C:\Program Files\Microsoft Visual Studio\2019\Enterprise\VC\Redist\MSVC"
            "C:\Program Files\Microsoft Visual Studio\2019\Community\VC\Redist\MSVC"
          )

          $crtDll = $null
          foreach ($root in $candidates) {
            if (-not $root -or -not (Test-Path $root)) { continue }
            Write-Host "Searching VC redist under: $root"
            # 複数バージョンの redist が同居する場合は *最新バージョン* を選ぶ。
            # heif.dll など vcpkg の DLL はランナー最新の MSVC toolset でビルド
            # され、新しい msvcp140.dll を要求する。古い redist をバンドルすると
            # heif.dll の起動時初期化が msvcp140.dll 内で null アクセス
            # (0xC0000005) → farman.exe が 0xc0000142 で起動できなくなる。
            $found = Get-ChildItem $root -Recurse -Filter "Microsoft.VC*.CRT" `
                       -Directory -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -like "*\x64\*" } |
                     Sort-Object { if ($_.FullName -match '\\(\d+\.\d+\.\d+)\\x64\\') { [version]$Matches[1] } else { [version]'0.0.0' } } -Descending |
                     Select-Object -First 1
            if ($found) { $crtDll = $found.FullName; break }
          }
          if (-not $crtDll) {
            # 最終フォールバック: Program Files の Visual Studio を丸ごとスキャン
            Write-Host "Fallback: scanning C:\Program Files\Microsoft Visual Studio recursively"
            $found = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse `
                       -Filter "Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -like "*\x64\*" } |
                     Sort-Object { if ($_.FullName -match '\\(\d+\.\d+\.\d+)\\x64\\') { [version]$Matches[1] } else { [version]'0.0.0' } } -Descending |
                     Select-Object -First 1
            if ($found) { $crtDll = $found.FullName }
          }
          if (-not $crtDll) {
            throw "Could not locate Microsoft.VC*.CRT redist directory on the runner"
          }
          Write-Host "Copying VC Runtime from $crtDll"
          Copy-Item "$crtDll\msvcp140*.dll"     -Destination build/Release/ -Force
          Copy-Item "$crtDll\vcruntime140.dll"  -Destination build/Release/ -Force
          # VCRUNTIME140_1 は CRT 1.40 以降のみ。無ければスキップ。
          Copy-Item "$crtDll\vcruntime140_1.dll" -Destination build/Release/ `
            -Force -ErrorAction SilentlyContinue
          Get-ChildItem build/Release/ -Filter "msvcp140*.dll" |
            ForEach-Object { Write-Host "  bundled: $($_.Name)" }
          Get-ChildItem build/Release/ -Filter "vcruntime*.dll" |
            ForEach-Object { Write-Host "  bundled: $($_.Name)" }

          # OSS ライセンス通知を Release ディレクトリに同梱する。ここに置くと
          # 後段の Compress-Archive (zip) と farman.iss の [Files] Source:
          # "{#SrcDir}\*" の両方で {app} / zip ルートに取り込まれる
          # (BSD/LGPL/MPL のバイナリ配布通知義務を満たす)。
          Copy-Item LICENSE -Destination build/Release/LICENSE.txt -Force
          Copy-Item resources/licenses/THIRD-PARTY-LICENSES.txt `
            -Destination build/Release/THIRD-PARTY-LICENSES.txt -Force

          # CMakeLists.txt の project(farman VERSION X.Y.Z) を抽出して
          # Inno Setup と zip 名に渡す。
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(farman VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          Write-Host "Detected version: $version"

          # windows-dist/ に成果物 2 種を入れる
          New-Item -ItemType Directory -Path windows-dist -Force | Out-Null

          # 2. ポータブル用 zip (Releases はファイル単位 upload のみ受け付けるため
          #    フォルダのままでは渡せない)
          Compress-Archive -Path build/Release/* `
            -DestinationPath "windows-dist/farman-windows-x64.zip"

          # 3. Inno Setup インストーラ (.exe) — GitHub Actions の windows-latest
          #    runner には Inno Setup 6 がプリインストールされている。`iscc` は
          #    "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" にあるが、
          #    PATH には通っていないので明示パスで呼ぶ。
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress --yes
          }
          # /DSrcDir には絶対パスを渡す。Inno Setup の [Files] Source: の相対
          # パスは .iss のある場所 (= windows/) からの相対として解決されるため、
          # "build\Release" のように相対で渡すと windows\build\Release を探して
          # しまう。Resolve-Path で絶対化しておく。
          & "$iscc" `
            "/DAppVersion=$version" `
            "/DSrcDir=$((Resolve-Path build\Release).Path)" `
            "/O$((Resolve-Path windows-dist).Path)" `
            "windows\farman.iss"

          Get-ChildItem windows-dist

      # self-contained 化した build/Release で farman.exe を実際に起動し、全
      # import DLL がロードできることを検証する (起動時 DLL 初期化失敗
      # = 0xc0000142 のリグレッション検出)。--version は QApplication 生成
      # (= 全 DLL ロード) 直後に early exit するので、GUI を出さずに起動可否
      # だけを確認できる。
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location build/Release
          $p = Start-Process -FilePath .\farman.exe -ArgumentList '--version' `
            -NoNewWindow -PassThru -Wait
          $code = $p.ExitCode
          Write-Host ("farman.exe --version exit code: 0x{0:X8} ({1})" -f $code, $code)
          if ($code -ne 0) {
            # どの依存 DLL が・なぜ失敗するかを LoadLibrary で個別診断する。
            # LoadLibrary のエラー: 126=ERROR_MOD_NOT_FOUND (依存欠落),
            # 193=ERROR_BAD_EXE_FORMAT (不正イメージ),
            # 1114=ERROR_DLL_INIT_FAILED (DllMain 初期化失敗)。
            $sig = '[DllImport("kernel32.dll", SetLastError=true, CharSet=CharSet.Unicode)] public static extern IntPtr LoadLibraryEx(string path, IntPtr h, uint flags); [DllImport("kernel32.dll")] public static extern uint GetLastError();'
            $k = Add-Type -MemberDefinition $sig -Name NativeLoad -PassThru
            # LOAD_WITH_ALTERED_SEARCH_PATH = 0x8 (DLL のディレクトリを依存検索に含める)
            foreach ($dll in @('heif.dll','libde265.dll','archive.dll','uchardet.dll')) {
              if (-not (Test-Path $dll)) { Write-Host "$dll : NOT PRESENT in package"; continue }
              $full = (Resolve-Path $dll).Path
              $h = $k::LoadLibraryEx($full, [IntPtr]::Zero, 0x8)
              if ($h -eq [IntPtr]::Zero) {
                Write-Host ("{0} : LoadLibrary FAILED, GetLastError={1}" -f $dll, $k::GetLastError())
              } else {
                Write-Host "$dll : loaded OK"
              }
            }
            Pop-Location
            Write-Error "farman.exe failed to start (exit 0x$('{0:X8}' -f $code)); see LoadLibrary diagnostics above."
            exit 1
          }
          Pop-Location
          Write-Host "Smoke test passed: farman.exe starts and loads all DLLs."

      - name: Deploy (Linux)
        if: runner.os == 'Linux'
        run: |
          # === Step 1: AppImage 生成 (既存ロジック) ===
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          cp images/icon-256.png farman.png

          # OSS ライセンス通知を AppDir に先置きしておく。linuxdeploy は
          # 既存の AppDir 内容を保持したまま Qt を bundle するので、ここで
          # /usr/share/doc/farman/ に入れておけば AppImage に取り込まれる
          # (BSD/LGPL/MPL のバイナリ配布通知義務を満たす)。
          mkdir -p AppDir/usr/share/doc/farman
          cp LICENSE                                 AppDir/usr/share/doc/farman/copyright
          cp resources/licenses/THIRD-PARTY-LICENSES.txt AppDir/usr/share/doc/farman/THIRD-PARTY-LICENSES.txt

          # 同梱公式ビュアープラグイン。farman は実行ファイル横の
          # ../plugins/viewers を探索するため、AppDir/usr/plugins/viewers に
          # 先置きして AppImage / .deb の両方へ取り込む。
          mkdir -p AppDir/usr/plugins/viewers
          cp build/plugins/viewers/* AppDir/usr/plugins/viewers/

          # Qt Multimedia の ffmpeg バックエンドプラグイン (plugins/multimedia/)。
          # farman 本体は Qt6Multimedia をリンクしないため linuxdeploy-plugin-qt の
          # 自動検出に乗らない。EXTRA_QT_PLUGINS で明示的に取り込む
          # (MediaViewerPlugin.so の動画 / 音声再生に必要)。
          export EXTRA_QT_PLUGINS="multimedia"

          # MediaViewerPlugin.so は QPluginLoader で動的ロードされるため
          # linuxdeploy の依存スキャン (本体 exe + EXTRA_QT_PLUGINS) に乗らず、
          # それだけが必要とする libQt6MultimediaWidgets が取りこぼされていた
          # (結果 Linux でメディアプラグインがロード失敗し mp3/mp4 が再生不可)。
          # --deploy-deps-only でプラグイン本体はコピーせず依存だけ取り込ませる。
          #
          # 外部 3D ビュアープラグイン (ModelViewerPlugin) はロード時に
          # libQt6OpenGL.so.6 を必要とする。farman 本体は Qt6::OpenGL をリンクして
          # いるが Qt6OpenGL のシンボルを実際には参照しないため、リンカの
          # --as-needed で DT_NEEDED から落ち、linuxdeploy の依存スキャンに乗らず
          # 同梱されない (Windows で Qt6OpenGL.dll が windeployqt に取り込まれない
          # のと同じ現象)。--library で明示的に AppDir へ同梱する
          # (AppImage / .deb の両方に入る)。QT_ROOT_DIR は install-qt-action が設定。
          QT6OPENGL_LIB="$QT_ROOT_DIR/lib/libQt6OpenGL.so.6"
          if [ ! -e "$QT6OPENGL_LIB" ]; then
            QT6OPENGL_LIB=$(find "$QT_ROOT_DIR/lib" -maxdepth 1 -name 'libQt6OpenGL.so.6*' 2>/dev/null | sort | head -1)
          fi
          echo "Qt6OpenGL lib to bundle: $QT6OPENGL_LIB"
          if [ -z "$QT6OPENGL_LIB" ] || [ ! -e "$QT6OPENGL_LIB" ]; then
            echo "::error::libQt6OpenGL.so.6 not found under $QT_ROOT_DIR/lib"
            exit 1
          fi

          export OUTPUT=farman-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            -e build/farman \
            -i farman.png \
            -d linux/farman.desktop \
            --deploy-deps-only AppDir/usr/plugins/viewers/MediaViewerPlugin.so \
            --library "$QT6OPENGL_LIB" \
            --plugin qt \
            --output appimage
          ls -la farman-x86_64.AppImage
          # 同梱確認 (取りこぼしたら即 fail させて気付けるように)
          echo "=== libQt6OpenGL 同梱確認 (AppDir) ==="
          find AppDir -name 'libQt6OpenGL.so*' -print
          if ! find AppDir -name 'libQt6OpenGL.so.6*' | grep -q .; then
            echo "::error::libQt6OpenGL.so.6 was not bundled into AppDir"
            exit 1
          fi

          # === Step 2: .deb 生成 ===
          # linuxdeploy が作った AppDir (= self-contained な Qt frameworks +
          # libarchive / uchardet を bundle 済み) をそのまま /opt/farman/ に
          # 詰めて .deb 化する。Ubuntu / Debian / Mint で OS 標準の Qt 6
          # バージョン差に振り回されない。
          VERSION=$(grep 'project(farman VERSION' CMakeLists.txt \
                     | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
          PKG=deb-pkg
          rm -rf "$PKG"

          # 実行ファイルの rpath が `$ORIGIN/../lib` (linuxdeploy-plugin-qt の
          # デフォルト) なので、必ず /opt/farman/bin/farman の位置に置く必要
          # がある。/opt/farman/farman 直下に置くと ../lib = /opt/lib となり
          # libQt6Widgets.so.6 が見つからず起動失敗する。
          #
          # AppDir 内の実行ファイル / qt.conf の正確なパスは linuxdeploy の
          # バージョンや plugin の組み合わせで揺れるので、find で実体を探して
          # 明示的に /opt/farman/bin/ に配置する。lib / plugins / translations
          # /qml は AppDir/usr/<name> をそのまま /opt/farman/<name> にコピー。
          mkdir -p "$PKG/opt/farman/bin"

          # AppDir 構造を CI ログに出して将来のデバッグを容易にする
          echo "=== AppDir layout ==="
          find AppDir -maxdepth 3 -mindepth 1 | sort | head -40
          echo "=== AppDir/usr/bin contents (if any) ==="
          ls -la AppDir/usr/bin/ 2>&1 || echo "(no AppDir/usr/bin)"

          # 実行ファイル: AppDir 配下で executable な farman を最初の 1 件
          FARMAN_BIN=$(find AppDir -type f -name farman -executable 2>/dev/null | head -1)
          if [ -z "$FARMAN_BIN" ]; then
            echo "::error::farman executable not found in AppDir"
            find AppDir -type f -name farman
            exit 1
          fi
          echo "Found farman binary at: $FARMAN_BIN"
          cp "$FARMAN_BIN" "$PKG/opt/farman/bin/farman"

          # qt.conf: 実行ファイルと同じディレクトリに置く必要がある。
          # 中身は通常 `Plugins=../plugins` 等の相対参照なので、bin/ から
          # 見て ../plugins = /opt/farman/plugins が解決される。
          FARMAN_QTCONF=$(find AppDir -type f -name qt.conf 2>/dev/null | head -1)
          if [ -n "$FARMAN_QTCONF" ]; then
            cp "$FARMAN_QTCONF" "$PKG/opt/farman/bin/qt.conf"
            echo "Copied qt.conf from $FARMAN_QTCONF:"
            cat "$PKG/opt/farman/bin/qt.conf"
          fi

          # lib / plugins / translations / qml は AppDir/usr/<name> 構造を
          # /opt/farman/ に複製する。
          if [ -d AppDir/usr/lib ]; then
            cp -R AppDir/usr/lib          "$PKG/opt/farman/"
          fi
          if [ -d AppDir/usr/plugins ]; then
            cp -R AppDir/usr/plugins      "$PKG/opt/farman/"
          fi
          if [ -d AppDir/usr/qml ]; then
            cp -R AppDir/usr/qml          "$PKG/opt/farman/"
          fi
          if [ -d AppDir/usr/translations ]; then
            cp -R AppDir/usr/translations "$PKG/opt/farman/"
          fi

          # ──── 外向け symlink / 共有資源 ────
          # ターミナル / アプリケーションメニューからは /usr/bin/farman で起動可能に
          mkdir -p "$PKG/usr/bin"
          ln -s /opt/farman/bin/farman "$PKG/usr/bin/farman"

          # デスクトップエントリ + アイコン (XDG 標準位置)
          mkdir -p "$PKG/usr/share/applications"
          cp linux/farman.desktop "$PKG/usr/share/applications/farman.desktop"
          mkdir -p "$PKG/usr/share/icons/hicolor/256x256/apps"
          cp images/icon-256.png  "$PKG/usr/share/icons/hicolor/256x256/apps/farman.png"

          # OSS ライセンス通知 (Debian 慣習の /usr/share/doc/<pkg>/)。
          # copyright = farman 自身の MIT、加えて同梱 OSS の通知全文。
          # BSD/LGPL/MPL のバイナリ配布通知義務を満たす。
          mkdir -p "$PKG/usr/share/doc/farman"
          cp LICENSE                                 "$PKG/usr/share/doc/farman/copyright"
          cp resources/licenses/THIRD-PARTY-LICENSES.txt "$PKG/usr/share/doc/farman/THIRD-PARTY-LICENSES.txt"

          # ──── DEBIAN/control メタデータ ────
          mkdir -p "$PKG/DEBIAN"
          INSTALLED_SIZE=$(du -sk "$PKG/opt" "$PKG/usr" | awk '{s+=$1} END{print s}')
          cat > "$PKG/DEBIAN/control" << EOF
          Package: farman
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Installed-Size: ${INSTALLED_SIZE}
          Maintainer: Mashsoft Inc. <noreply@mashsoft.co.jp>
          Homepage: https://github.com/mashsoft-jp/farman
          Description: Qt6 dual-pane file manager
           A keyboard-driven dual-pane file manager built on Qt 6.
           Supports archive browsing (zip / tar / gz / bz2 / xz),
           directory comparison, and built-in viewers (text / image / binary).
          EOF

          # ──── 権限整備 + パッケージング ────
          # dpkg-deb は実行ファイルが executable bit を持っていること、
          # ディレクトリが 755 であることを要求する。
          find "$PKG" -type d -exec chmod 755 {} +
          chmod 755 "$PKG/opt/farman/bin/farman"
          chmod 644 "$PKG/DEBIAN/control"

          # 最終構造をログ出力 (将来の調査用)
          echo "=== final deb layout ==="
          find "$PKG/opt/farman" -maxdepth 2 | sort | head -30

          DEB_NAME="farman_${VERSION}_amd64.deb"
          dpkg-deb --build --root-owner-group "$PKG" "$DEB_NAME"
          ls -la "$DEB_NAME"

          # === Step 3: 後段の artifact upload 用にひとまとめ ===
          mkdir -p linux-dist
          mv farman-x86_64.AppImage  linux-dist/
          mv "$DEB_NAME"             linux-dist/
          ls -la linux-dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist

      - name: Rename artifacts with tag
        run: |
          cd dist
          ls -la */
          TAG="${{ steps.tag.outputs.tag }}"
          mv macos/farman.dmg                       "farman-${TAG}-macos-arm64.dmg"
          mv linux/farman-x86_64.AppImage           "farman-${TAG}-linux-x86_64.AppImage"
          mv linux/farman_*_amd64.deb               "farman-${TAG}-linux-x86_64.deb"
          mv windows/farman-windows-x64.zip         "farman-${TAG}-windows-x64.zip"
          mv windows/farman-setup-windows-x64.exe   "farman-${TAG}-windows-x64-setup.exe"
          ls -la

      - name: Generate SHA256 checksums
        run: |
          # 各配布アセットに対して "<asset>.sha256" を作成する。farman 本体の
          # 自動アップデート (UpdateDownloader) が同名 + .sha256 のアセットを
          # 取得してダウンロード本体と照合する。
          cd dist
          for f in farman-*-macos-arm64.dmg \
                   farman-*-linux-x86_64.AppImage \
                   farman-*-linux-x86_64.deb \
                   farman-*-windows-x64.zip \
                   farman-*-windows-x64-setup.exe ; do
            [ -e "$f" ] || continue
            shasum -a 256 "$f" > "$f.sha256"
            echo "Generated $f.sha256:"
            cat "$f.sha256"
          done
          ls -la *.sha256

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: farman ${{ steps.tag.outputs.tag }}
          draft: true
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            dist/farman-*-macos-arm64.dmg
            dist/farman-*-macos-arm64.dmg.sha256
            dist/farman-*-linux-x86_64.AppImage
            dist/farman-*-linux-x86_64.AppImage.sha256
            dist/farman-*-linux-x86_64.deb
            dist/farman-*-linux-x86_64.deb.sha256
            dist/farman-*-windows-x64.zip
            dist/farman-*-windows-x64.zip.sha256
            dist/farman-*-windows-x64-setup.exe
            dist/farman-*-windows-x64-setup.exe.sha256
